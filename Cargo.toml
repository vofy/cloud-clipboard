[package]
name = "cloud-clipboard"
version = "0.1.1"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
ksni = { version = "0.3.7", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
