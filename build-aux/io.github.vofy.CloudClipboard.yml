id: io.github.vofy.CloudClipboard
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cloud-clipboard
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # rclone's config and sign-ins (~/.config/rclone), local folders to watch, and the
  # login autostart entry (~/.config/autostart)
  - --filesystem=home
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.a'

modules:
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone /app/bin/rclone
    sources:
      - type: archive
        url: https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-amd64.zip
        sha256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        only-arches: [x86_64]

  - name: wl-clipboard
    buildsystem: meson
    config-opts: [-Dfishcompletiondir=no, -Dzshcompletiondir=no]
    sources:
      - type: git
        url: https://github.com/bugaevc/wl-clipboard.git
        tag: v2.3.0
        commit: 67a7b937895bceec1ae5ccebb10216f63f70ca1b

  # Only pdftoppm, to paste the first page of a PDF as an image.
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_UTILS=ON
      - -DENABLE_CPP=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_GOBJECT_INTROSPECTION=OFF
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_GPGME=OFF
      - -DENABLE_LIBCURL=OFF
      - -DENABLE_LIBOPENJPEG=none
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    post-install:
      - find /app/bin -name 'pdf*' ! -name pdftoppm -delete
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.11.0.tar.xz
        sha256: 41c32680160addf5a8dd7a830e4869c01e9f6bee1abb91e44fabd1ba9d7828fb

  - name: cloud-clipboard
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/cloud-clipboard/cargo
      # Crates are downloaded during the build. Fine for our own bundle; Flathub would need
      # them listed as sources (flatpak-cargo-generator).
      build-args: [--share=network]
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/cloud-clipboard /app/bin/cloud-clipboard
      - install -Dm644 data/$FLATPAK_ID.desktop /app/share/applications/$FLATPAK_ID.desktop
      - install -Dm644 data/$FLATPAK_ID.svg /app/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 data/$FLATPAK_ID.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip: [target, .flatpak-builder, build-dir, repo, AppDir]
